<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f4">
  <meta name="description" content="UI DSign Agent 是一个给 Codex 用的开源 UI 设计 Skill。试用双色叠印工作坊的预约界面，并把设计提示词带回你的项目。">
  <meta property="og:title" content="UI DSign Agent">
  <meta property="og:description" content="从设计提示词到可操作的界面。现场体验一张双色叠印工作坊预约页。">
  <meta property="og:type" content="website">
  <title>UI DSign Agent · 设计与交互实作</title>
  <style>
    :root {
      color-scheme: light;
      --paper:#f8f8f4; --ink:#16171b; --soft:#53565a; --line:#c9c9c0;
      --blue:#2438c7; --poster:#ff714c; --cyan:#132daf; --stock:#fff7e9;
      --sans:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
      font-family:var(--sans); color:var(--ink); background:var(--paper);
    }
    *,*::before,*::after { box-sizing:border-box }
    body { margin:0 }
    button,input { font:inherit; color:inherit }
    button,a,summary { -webkit-tap-highlight-color:transparent }
    button,summary { cursor:pointer }
    a { color:inherit; text-decoration-thickness:1px; text-underline-offset:4px }
    :focus-visible { outline:3px solid var(--blue); outline-offset:4px }
    [hidden] { display:none !important }
    .page { width:min(1336px,100%); margin:auto; padding:0 clamp(20px,4.8vw,76px) 30px }
    .top,.top a,.brand,.actions,.work-caption,.brief summary,.booking-foot { display:flex; align-items:center }
    .top { min-height:63px; justify-content:space-between; gap:16px; border-bottom:1px solid var(--ink) }
    .brand { gap:10px; font-size:14px; font-weight:700 }
    .mark { display:inline-flex; gap:2px; width:24px; height:23px; align-items:end; transform:skewX(-14deg); overflow:hidden }
    .mark i { display:block; width:6px; height:16px; background:var(--blue) }
    .mark i:nth-child(2) { height:23px }
    .mark i:last-child { height:11px }
    .top a { min-height:44px; gap:8px; text-decoration:none; font-size:14px; font-weight:650 }
    .launch { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(250px,.8fr); align-items:center; gap:clamp(24px,4.2vw,64px); margin:clamp(25px,3.5vw,50px) 0 }
    h1,p,h2 { margin:0 }
    h1 { font-size:clamp(60px,7.85vw,111px); font-weight:700; letter-spacing:-.065em; line-height:.98; white-space:nowrap }
    h1 span { color:var(--blue) }
    .lead { font-size:clamp(15px,1.22vw,18px); line-height:1.6; max-width:26em }
    .actions { gap:18px; flex-wrap:wrap; margin-top:13px; font-size:14px; font-weight:650 }
    .download { display:inline-flex; align-items:center; gap:14px; min-height:42px; padding:0 15px; background:var(--ink); color:white; text-decoration:none }
    .download:hover { background:var(--blue) }
    .actions a:last-child { display:inline-flex; align-items:center; min-height:42px }
    .work-caption { justify-content:space-between; gap:12px; border-top:1px solid var(--line); padding:13px 0; font-size:13px }
    .work-caption h2 { font-size:14px; font-weight:700 }
    .work-caption span { color:var(--soft) }
    .work { display:grid; grid-template-columns:minmax(0,1.57fr) minmax(270px,.85fr); background:#18265c }
    .poster { position:relative; isolation:isolate; overflow:hidden; min-height:350px; margin:0; background:var(--poster); color:#171622 }
    .poster::after { content:""; position:absolute; z-index:3; inset:0; pointer-events:none; opacity:.12; background-image:radial-gradient(#30161c .65px,transparent .85px); background-size:3px 3px }
    .poster-inner { position:absolute; z-index:2; inset:clamp(20px,2.5vw,38px); display:flex; align-items:start; flex-direction:column; justify-content:space-between }
    .process,.poster-footer { font:650 12px/1.25 "Courier New",monospace; letter-spacing:.07em; text-transform:uppercase }
    .poster-type { display:flex; flex-direction:column; align-items:start; font-family:"Helvetica Neue",Arial,sans-serif; font-weight:900; font-size:clamp(66px,7.9vw,120px); line-height:.74; letter-spacing:-.065em; position:relative; left:-.045em }
    .poster-type span:last-child { margin-top:.10em }
    .poster-footer { font-size:11px }
    .ink-field { position:absolute; inset:0; overflow:hidden; pointer-events:none }
    .ribbon { position:absolute; left:71%; top:49%; width:54%; height:92%; transform:translate(-50%,-50%) rotate(17deg) }
    .trace { position:absolute; left:6%; top:17%; width:80%; height:64%; border:clamp(2px,.22vw,4px) solid var(--cyan); border-radius:51% 49% 50% 50% / 42% 52% 48% 58%; transform:translate(var(--x),var(--y)) rotate(var(--turn)); }
    .register { position:absolute; height:13px; width:13px; right:12px; top:12px; color:var(--ink) }
    .register::before,.register::after { content:""; position:absolute; background:currentColor }
    .register::before { width:100%; height:1px; top:6px }
    .register::after { width:1px; height:100%; left:6px }
    .register.bottom { top:auto; bottom:12px }
    .booking { padding:clamp(23px,2.4vw,39px); background:#18265c; color:#fff9eb; display:flex; flex-direction:column; justify-content:center; min-width:0 }
    .booking h3 { font-size:clamp(22px,2.05vw,34px); letter-spacing:-.045em; line-height:1.22; margin:0 }
    .booking-meta { margin-top:7px; color:#d0d8ef; font-size:13px; line-height:1.55 }
    .booking fieldset { margin:19px 0 13px; border:0; padding:0; min-width:0 }
    .booking legend { font-size:13px; margin-bottom:6px; font-weight:650; padding:0 }
    .slot { position:relative; display:flex; align-items:center; justify-content:space-between; gap:9px; min-height:45px; padding:5px 3px; border-top:1px solid #647097; cursor:pointer; font-size:14px }
    .slot:last-of-type { border-bottom:1px solid #647097 }
    .slot input { position:absolute; width:1px; height:1px; opacity:0 }
    .day { display:inline-flex; align-items:center; gap:9px; font-weight:650 }
    .day::before { content:""; display:inline-block; width:15px; height:15px; border:1.5px solid #bec8e4; border-radius:50% }
    .slot input:checked + .day::before { border:4px solid #ff9a76; background:#18265c }
    .slot input:focus-visible + .day { outline:2px solid #ffb493; outline-offset:3px }
    .time { font-variant-numeric:tabular-nums }
    .confirm,.reset { width:100%; min-height:44px; padding:9px 13px; border:0; display:flex; align-items:center; justify-content:space-between; font-weight:700; text-align:left }
    .confirm { background:#ff9977; color:#241b25 }
    .confirm:hover { background:#ffb79d }
    .booking :focus-visible { outline-color:#ffe395 }
    .booking-foot { font-size:12px; color:#d0d8ef; line-height:1.5; margin-top:9px }
    .result { display:flex; flex-direction:column; justify-content:center; min-height:202px; gap:12px }
    .result h4 { font-size:15px; color:#ffb493; margin:0 }
    .chosen { font-weight:650; font-size:clamp(21px,2vw,30px); line-height:1.35; letter-spacing:-.035em }
    .reset { background:transparent; color:white; border:1px solid #8e9ac2; margin-top:4px }
    .brief { border-bottom:1px solid var(--line); margin-top:5px }
    .brief summary { min-height:56px; justify-content:space-between; font-weight:650; font-size:15px; list-style:none }
    .brief summary::-webkit-details-marker { display:none }
    .brief summary::after { content:"+"; font:25px/1 Arial,sans-serif; color:var(--blue) }
    .brief[open] summary::after { content:"−" }
    .brief-body { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:0 0 18px }
    .brief code { font:15px/1.7 var(--sans); overflow-wrap:anywhere; max-width:62em }
    .copy { flex:none; border:1px solid var(--ink); background:transparent; min-height:42px; padding:0 14px }
    .copy:hover { background:var(--ink); color:white }
    .copy-feedback { color:var(--soft); margin:0 0 12px; font-size:13px }
    @media (min-width:1450px) { .poster { min-height:410px } }
    @media (max-width:900px) {
      .launch { grid-template-columns:minmax(0,1.35fr) minmax(220px,.85fr); gap:20px }
      h1 { font-size:7.7vw }
      .work { grid-template-columns:minmax(0,1.25fr) minmax(242px,.9fr) }
      .poster-type { font-size:clamp(62px,8vw,90px) }
    }
    @media (max-width:700px) {
      .page { padding:0 18px 18px }
      .top { min-height:49px }
      .launch { display:block; margin:24px 0 15px }
      h1 { font-size:clamp(43px,10vw,69px) }
      .lead { margin-top:12px; max-width:38em; font-size:15px }
      .actions { margin-top:7px }
      .work-caption { padding:10px 0 }
      .work { grid-template-columns:1fr }
      .poster { min-height:0; aspect-ratio:1.95 }
      .poster-inner { inset:16px 18px }
      .process,.poster-footer { font-size:9px }
      .poster-type { font-size:clamp(48px,12vw,78px) }
      .booking { padding:20px }
      .booking fieldset { margin:13px 0 10px }
      .brief-body { align-items:flex-start; flex-direction:column; gap:12px }
    }
    @media (prefers-reduced-motion:no-preference) {
      .download,.confirm,.copy { transition:background-color .16s,color .16s }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>开源 Codex 设计 Skill</div>
      <a href="https://github.com/w88856678-rgb/ui-dsign-agent">GitHub <span aria-hidden="true">↗</span></a>
    </header>
    <main>
      <header class="launch">
        <h1>UI DSign <span>Agent</span></h1>
        <div>
          <p class="lead">把参考图、线框或已有页面交给 Codex，做出可以实际操作的网页和移动界面。</p>
          <div class="actions">
            <a class="download" href="https://github.com/w88856678-rgb/ui-dsign-agent/releases/latest/download/ui-dsign-agent.zip">下载安装包 <span aria-hidden="true">↓</span></a>
            <a href="https://github.com/w88856678-rgb/ui-dsign-agent#安装">安装说明</a>
          </div>
        </div>
      </header>
      <section aria-labelledby="example-title">
        <div class="work-caption"><h2 id="example-title">预约页实作</h2><span>可交互演示</span></div>
        <div class="work">
          <figure class="poster" role="img" aria-label="双色叠印工作坊海报。橙红色纸面上，深蓝色线条错位叠出旋转的印痕，左侧大字为 OVERPRINT。">
            <div class="ink-field" aria-hidden="true"><div class="ribbon"></div><i class="register"></i><i class="register bottom"></i></div>
            <div class="poster-inner" aria-hidden="true">
              <span class="process" lang="en">Two-colour screen printing</span>
              <div class="poster-type" lang="en"><span>OVER</span><span>PRINT</span></div>
              <span class="poster-footer">双色叠印 / 工作坊</span>
            </div>
          </figure>
          <div class="booking">
            <h3>双色叠印工作坊</h3>
            <p class="booking-meta">用两层色墨，手印一张自己的海报。</p>
            <form id="booking-form">
              <fieldset>
                <legend>选择场次</legend>
                <label class="slot"><input type="radio" name="session" value="周六 10:00–12:00" checked><span class="day">周六</span><span class="time">10:00–12:00</span></label>
                <label class="slot"><input type="radio" name="session" value="周日 14:00–16:00"><span class="day">周日</span><span class="time">14:00–16:00</span></label>
              </fieldset>
              <button class="confirm" type="submit">确认场次 <span aria-hidden="true">↗</span></button>
            </form>
            <div id="result" class="result" hidden>
              <h4 id="result-heading" tabindex="-1">已选定场次</h4>
              <p class="chosen" id="chosen"></p>
              <button class="reset" type="button">重新选择 <span aria-hidden="true">↶</span></button>
            </div>
            <p class="booking-foot">演示预约，仅在当前页面生效。</p>
          </div>
        </div>
        <details class="brief">
          <summary>查看这个页面的设计提示词</summary>
          <div class="brief-body">
            <code id="prompt">$ui-dsign-agent 做一个双色印刷工作坊的预约页。用橙红与深蓝叠印海报，让访客第一眼看到可预约的场次，能用键盘选时间，确认后能看到自己选了哪一场。</code>
            <button class="copy" type="button">复制提示词</button>
          </div>
          <p class="copy-feedback" role="status" hidden></p>
        </details>
      </section>
    </main>
  </div>
  <script>
    const ribbon = document.querySelector('.ribbon');
    for (let i = 0; i < 34; i++) {
      const trace = document.createElement('i');
      trace.className = 'trace';
      trace.style.setProperty('--x', (i - 16.5) * 1.45 + '%');
      trace.style.setProperty('--y', (16.5 - i) * 1.12 + '%');
      trace.style.setProperty('--turn', (-42 + i * 3.3) + 'deg');
      ribbon.append(trace);
    }

    const form = document.querySelector('#booking-form');
    const result = document.querySelector('#result');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      document.querySelector('#chosen').textContent = form.elements.session.value;
      form.hidden = true;
      result.hidden = false;
      document.querySelector('#result-heading').focus();
    });
    result.querySelector('button').addEventListener('click', () => {
      result.hidden = true;
      form.hidden = false;
      form.querySelector('input:checked').focus();
    });

    const promptText = document.querySelector('#prompt');
    const feedback = document.querySelector('.copy-feedback');
    document.querySelector('.copy').addEventListener('click', async () => {
      let copied = false;
      try {
        await navigator.clipboard.writeText(promptText.textContent);
        copied = true;
      } catch {
        const range = document.createRange();
        range.selectNodeContents(promptText);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        try { copied = document.execCommand('copy'); } catch { /* Keep the prompt selected for manual copy. */ }
      }
      feedback.hidden = false;
      feedback.textContent = copied ? '已复制，可以粘贴到 Codex。' : '已选中提示词，可以手动复制。';
    });
  </script>
</body>
</html>
